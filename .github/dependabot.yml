# Weekly version updates for GitHub Actions.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Standard shape from the dani-foundations templates: npm minor/patch bumps are grouped,
# while github-actions (and any other ecosystem) stay ungrouped so each bump — which moves
# a pinned commit, not just a version — gets individually reviewed via the
# dependabot-triage skill.
#
# Only github-actions is configured for now: Dependabot errors on a directory with no
# manifest. Add blocks for gomod (/server), npm (/client, grouped as in the template) and
# pip (/pipeline) when those manifests exist.
version: 2
updates:
  - package-ecosystem: github-actions
    # Scans .github/workflows (and root action manifests). Keep ungrouped so
    # Action SHA/tag bumps stay reviewable one at a time.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
